{% extends 'base.html' %}
{% block title %}Nouveau mouvement — PharmaGest{% endblock %}
{% block page_title %}Nouveau mouvement de stock{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-lg-6">
    <div class="card module-card">
      <div class="card-header-custom">
        <h5><i class="bi bi-arrow-left-right me-2"></i>Enregistrer un mouvement</h5>
        <a href="{% url 'stock:liste' %}" class="btn btn-outline-secondary btn-sm">
          <i class="bi bi-arrow-left me-1"></i>Retour
        </a>
      </div>
      <div class="p-4">
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-semibold">Médicament *</label>
            <select name="medicament" class="form-select" required>
              <option value="">-- Choisir un médicament --</option>
              {% for med in form.medicament.field.queryset %}
              <option value="{{ med.pk }}"
                {% if form.medicament.value == med.pk|stringformat:"s" %}selected{% endif %}>
                {{ med.nom }} (stock : {{ med.quantite_stock }})
              </option>
              {% endfor %}
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Type de mouvement *</label>
            <select name="type_mouvement" class="form-select" required>
              <option value="">-- Choisir --</option>
              <option value="entree">⬆ Entrée (livraison)</option>
              <option value="sortie">⬇ Sortie (vente)</option>
              <option value="ajustement">⟳ Ajustement manuel</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Quantité *</label>
            <input type="number" name="quantite" class="form-control"
                   min="1" placeholder="Ex: 50" required>
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold">Motif</label>
            <input type="text" name="motif" class="form-control"
                   placeholder="Ex: Livraison fournisseur Diallo">
          </div>

          <div class="d-flex gap-2 justify-content-end pt-3"
               style="border-top:1px solid #F0F2F1;">
            <a href="{% url 'stock:liste' %}" class="btn btn-outline-secondary">Annuler</a>
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-check-lg me-1"></i>Enregistrer
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
