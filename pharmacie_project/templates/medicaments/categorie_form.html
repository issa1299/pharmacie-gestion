{% extends 'base.html' %}
{% block title %}Modifier catégorie — PharmaGest{% endblock %}
{% block page_title %}Modifier une catégorie{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-lg-6">
    <div class="card module-card">
      <div class="card-header-custom">
        <h5><i class="bi bi-pencil me-2"></i>Modifier — {{ categorie.nom }}</h5>
        <a href="{% url 'medicaments:categories' %}" class="btn btn-outline-secondary btn-sm">
          <i class="bi bi-arrow-left me-1"></i>Retour
        </a>
      </div>
      <div class="p-4">
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-semibold">Nom *</label>
            <input type="text" name="nom" class="form-control"
                   value="{{ categorie.nom }}" required autofocus>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Description</label>
            <textarea name="description" class="form-control" rows="3">{{ categorie.description }}</textarea>
          </div>
          <div class="d-flex gap-2 justify-content-end pt-3" style="border-top:1px solid #F0F2F1;">
            <a href="{% url 'medicaments:categories' %}" class="btn btn-outline-secondary">Annuler</a>
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-check-lg me-1"></i>Enregistrer
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
